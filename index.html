<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sección de Información — Glasswave. Liquid glass real con WebGL." />
  <meta name="theme-color" content="#050508" />
  <title>Sección de Información | Glasswave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── WebGL canvas BEHIND everything ── -->
  <canvas id="glCanvas" aria-hidden="true"></canvas>

  <!-- ── Main content ── -->
  <main class="page" id="page">

    <!-- HEADER -->
    <header class="hdr" id="hdr">
      <div class="hdr-logo glass-host" id="hdrLogo" tabindex="0" role="img" aria-label="Glasswave logo">
        <svg viewBox="0 0 56 56" fill="none" class="logo-svg">
          <circle cx="28" cy="28" r="26" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
          <circle cx="28" cy="28" r="18" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
          <path d="M8 28 Q18 12 28 28 Q38 44 48 28" stroke="rgba(255,255,255,0.85)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M8 33 Q18 17 28 33 Q38 49 48 33" stroke="rgba(255,255,255,0.32)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
          <line x1="28" y1="3" x2="28" y2="53" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
          <line x1="3" y1="28" x2="53" y2="28" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
          <circle cx="28" cy="28" r="2.8" fill="rgba(255,255,255,0.95)"/>
        </svg>
        <div class="glass-edge-top"></div>
      </div>

      <div class="hdr-pill glass-host" id="hdrPill">
        <span class="hdr-pill__text" id="hdrTitle">Sección de información</span>
        <div class="glass-edge-top"></div>
      </div>

      <div class="hdr-wave glass-host" id="hdrWave" role="img" aria-label="Ola">
        <svg viewBox="0 0 48 48" fill="none" class="wave-svg">
          <path d="M7 32 C11 19 18 13 24 20 C30 27 37 16 43 9" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          <path d="M7 39 C11 27 18 21 24 28 C30 35 37 24 43 17" stroke="rgba(255,255,255,0.38)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="glass-edge-top"></div>
      </div>
    </header>

    <!-- CAROUSEL -->
    <section class="carousel-section" aria-label="Carrusel de noticias">
      <div class="carousel glass-host" id="carousel">
        <div class="carousel__track" id="carouselTrack" role="list"></div>

        <button class="carousel__btn carousel__btn--prev" id="prevBtn" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="carousel__btn carousel__btn--next" id="nextBtn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="carousel__dots" id="carouselDots" role="tablist"></div>
        <div class="carousel__progress"><div class="carousel__bar" id="carouselBar"></div></div>
        <div class="glass-edge-top"></div>
      </div>
    </section>

    <!-- NEWS CARD -->
    <section class="news-section" aria-label="Noticia destacada">
      <article class="news-card glass-host" id="newsCard">
        <div class="glass-edge-top"></div>
        <div class="glass-edge-left"></div>
        <div class="news-card__content" id="newsCardContent"></div>
      </article>
    </section>

  </main>

  <!-- Three.js FIRST, then app.js — both synchronous in body so order guaranteed -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
