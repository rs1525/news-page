<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sección de Información — Glasswave. Liquid glass real con WebGL." />
  <meta name="theme-color" content="#050508" />
  <title>Sección de Información | Glasswave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── WebGL canvas BEHIND everything ── -->
  <canvas id="glCanvas" aria-hidden="true"></canvas>

  <!-- ── Main content ── -->
  <main class="page" id="page">

    <!-- HEADER -->
    <header class="hdr" id="hdr">
      <div class="hdr-pill glass-host" id="hdrPill">
        <span class="hdr-pill__text" id="hdrTitle">Sección de información</span>
        <div class="glass-edge-top"></div>
      </div>
    </header>

    <!-- CAROUSEL -->
    <section class="carousel-section" aria-label="Carrusel de noticias">
      <div class="carousel glass-host" id="carousel">
        <div class="carousel__track" id="carouselTrack" role="list"></div>

        <button class="carousel__btn carousel__btn--prev" id="prevBtn" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="carousel__btn carousel__btn--next" id="nextBtn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M9 18l6-6-6-6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="carousel__dots" id="carouselDots" role="tablist"></div>
        <div class="carousel__progress"><div class="carousel__bar" id="carouselBar"></div></div>
        <div class="glass-edge-top"></div>
      </div>
    </section>

    <!-- NEWS CARD -->
    <section class="news-section" aria-label="Noticia destacada">
      <article class="news-card glass-host" id="newsCard">
        <div class="glass-edge-top"></div>
        <div class="glass-edge-left"></div>
        <div class="news-card__content" id="newsCardContent"></div>
      </article>
    </section>

  </main>

  <!-- Three.js FIRST, then app.js — both synchronous in body so order guaranteed -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
